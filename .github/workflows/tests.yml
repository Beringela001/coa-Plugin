name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The plugin header declares PHP 8.1 and WordPress 6.5 as the floor.
        include:
          - php: '8.1'
            wp: '6.5.5'
          - php: '8.3'
            wp: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: pepselect-coa-archive

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install the WordPress test suite
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: Run PHPUnit
        id: phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/pepselect-coa-archive/vendor/yoast/phpunit-polyfills
        run: |
          set -o pipefail
          vendor/bin/phpunit --testdox 2>&1 | tee /tmp/phpunit.log

      - name: Publish PHPUnit output to the run summary
        if: always()
        run: |
          {
            echo "### PHPUnit — PHP ${{ matrix.php }} / WP ${{ matrix.wp }}"
            echo '```'
            tail -c 60000 /tmp/phpunit.log 2>/dev/null || echo "no phpunit output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step summaries and artifacts both need authentication to read. Annotations
      # do not, so emit the failure tail as one so it can be diagnosed publicly.
      - name: Annotate the failure tail
        if: failure()
        run: |
          tail -n 60 /tmp/phpunit.log > /tmp/tail.txt 2>/dev/null || echo "no phpunit output" > /tmp/tail.txt
          encoded=$(python3 -c "
import sys
data = open('/tmp/tail.txt', encoding='utf-8', errors='replace').read()
data = data.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
sys.stdout.write(data[:8000])
")
          echo "::error title=PHPUnit PHP ${{ matrix.php }} WP ${{ matrix.wp }}::${encoded}"

      - name: Upload PHPUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: /tmp/phpunit.log
          if-no-files-found: warn
