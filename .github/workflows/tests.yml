name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The plugin header declares PHP 8.1 and WordPress 6.5 as the floor.
        # WP pinned on both legs. Resolving "latest" at runtime made the harness
        # non-deterministic and it fataled inside WordPress core's own compat
        # shims under newer PHP. The plugin floor is what the gate measures;
        # widening WP coverage is a separate exercise from a known-good pin.
        include:
          - php: '8.1'
            wp: '6.5.5'
          - php: '8.2'
            wp: '6.5.5'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: pepselect-coa-archive

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install the WordPress test suite
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: Run PHPUnit
        id: phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/pepselect-coa-archive/vendor/yoast/phpunit-polyfills
        run: |
          set -o pipefail
          vendor/bin/phpunit --testdox --log-junit /tmp/junit.xml 2>&1 | tee /tmp/phpunit.log

      - name: Publish PHPUnit output to the run summary
        if: always()
        run: |
          {
            echo "### PHPUnit — PHP ${{ matrix.php }} / WP ${{ matrix.wp }}"
            echo '```'
            tail -c 60000 /tmp/phpunit.log 2>/dev/null || echo "no phpunit output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step summaries and artifacts both need authentication to read. Annotations
      # do not, so emit the failure tail as one so it can be diagnosed publicly.
      - name: Annotate the failure tail
        if: failure()
        run: |
          if [ ! -s /tmp/phpunit.log ]; then echo "::error::no phpunit output captured"; exit 0; fi
          tail -n 6 /tmp/phpunit.log > /tmp/annot.txt
          python3 bin/ci-failure-index.py /tmp/junit.xml >> /tmp/annot.txt || true
          # GitHub truncates a single annotation message at roughly 4KB regardless
          # of what is sent, so the index is emitted in chunks instead of one blob.
          split -l 6 /tmp/annot.txt /tmp/annot_chunk_
          n=0
          for chunk in /tmp/annot_chunk_*; do
            n=$((n + 1))
            if [ "$n" -gt 24 ]; then break; fi
            encoded=$(sed 's/%/%25/g' "$chunk" | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3000)
            echo "::error title=idx ${n} (PHP ${{ matrix.php }})::${encoded}"
          done

      - name: Upload PHPUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: /tmp/phpunit.log
          if-no-files-found: warn
